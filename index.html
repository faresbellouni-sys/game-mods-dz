<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAME MODS DZ</title>
<style>
:root{--bg:#080812;--panel:#121225;--purple:#8b35ff;--blue:#176bff;--text:#f5f3ff;--muted:#b4b2ce}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
header{padding:22px 16px;text-align:center;background:#101020;border-bottom:1px solid #642bff}
h1{margin:0;color:#a66bff;font-size:30px}
header p{color:var(--muted)}
nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:12px}
button,a.btn{border:0;border-radius:9px;padding:11px 15px;background:linear-gradient(110deg,#6422e8,#176bff);color:white;cursor:pointer;text-decoration:none}
main{max-width:1100px;margin:auto;padding:16px}
input,textarea{width:100%;padding:12px;margin:6px 0 12px;border-radius:8px;border:1px solid #343456;background:#0d0d1b;color:white}
#search{margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:20px}
.card,.panel{background:var(--panel);border:1px solid #30234c;border-radius:14px;padding:16px;overflow-wrap:anywhere}
.card img{width:100%;height:145px;object-fit:cover;border-radius:9px;background:#202035}
.card h3{color:#b98aff}
.card p{color:var(--muted);line-height:1.6}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.secondary{background:#292943}
.danger{background:#b42343}
#admin{display:none;margin-top:28px}
.small{color:var(--muted);font-size:13px}
footer{text-align:center;padding:28px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>🎮 GAME MODS DZ</h1>
  <p>مودات الألعاب • ألعاب • مجتمع اللاعبين</p>
  <nav>
    <a class="btn" href="#games">الألعاب</a>
    <button onclick="showLogin()">دخول المدير</button>
  </nav>
</header>

<main>
  <h2 id="games">اكتشف الألعاب 🎯</h2>
  <input id="search" placeholder="🔎 ابحث عن لعبة..." oninput="filterGames()">
  <p id="status" class="small">جاري تحميل الألعاب...</p>
  <section id="gameList" class="grid"></section>

  <section id="login" class="panel" style="display:none;margin-top:28px">
    <h2>🔐 دخول المدير</h2>
    <form id="loginForm">
      <label>البريد الإلكتروني</label>
      <input id="email" type="email" required autocomplete="username">
      <label>كلمة السر</label>
      <input id="password" type="password" required autocomplete="current-password">
      <button type="submit">تسجيل الدخول</button>
      <button type="button" class="secondary" onclick="hideLogin()">إلغاء</button>
    </form>
    <p id="loginStatus" class="small"></p>
  </section>

  <section id="admin" class="panel">
    <h2>⚙️ لوحة الإدارة</h2>
    <p class="small">الألعاب اللي تزيدها هنا تتحفظ في قاعدة بيانات Supabase.</p>
    <form id="gameForm">
      <input id="gameName" placeholder="اسم اللعبة" required>
      <textarea id="gameDescription" placeholder="وصف اللعبة"></textarea>
      <input id="gameImage" type="url" placeholder="رابط صورة اللعبة">
      <input id="gameUrl" type="url" placeholder="رابط اللعبة أو الملف">
      <div class="actions">
        <button type="submit" id="saveButton">إضافة اللعبة</button>
        <button type="button" class="secondary" onclick="resetForm()">إلغاء التعديل</button>
        <button type="button" class="danger" onclick="logout()">خروج</button>
      </div>
    </form>
    <h3>الألعاب المحفوظة</h3>
    <div id="adminList"></div>
    <p id="adminStatus" class="small"></p>
  </section>
</main>

<footer>GAME MODS DZ © 2026 — موقع ألعاب ومودات</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://tephetndomaildpphbez.supabase.co";
const SUPABASE_KEY = "PASTE_YOUR_PUBLISHABLE_KEY_HERE";

let db = null;
let games = [];
let editingId = null;
let isAdmin = false;

const $ = id => document.getElementById(id);

function showLogin() {
  $("login").style.display = "block";
  $("login").scrollIntoView({behavior:"smooth"});
}
function hideLogin() {
  $("login").style.display = "none";
}
function safeText(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}
function safeUrl(value) {
  try {
    const u = new URL(value);
    return ["http:","https:"].includes(u.protocol) ? u.href : "";
  } catch { return ""; }
}

async function loadGames() {
  $("status").textContent = "جاري تحميل الألعاب...";
  if (!db) {
    $("status").textContent = "أضف مفتاح Publishable في الكود لربط قاعدة البيانات.";
    return;
  }
  const {data,error} = await db.from("games")
    .select("id,name,description,image_url,game_url")
    .order("created_at",{ascending:false});
  if(error) {
    $("status").textContent = "تعذّر تحميل الألعاب. راجع إعدادات Supabase.";
    return;
  }
  games = data || [];
  renderGames();
  renderAdminGames();
  $("status").textContent = games.length
    ? `عدد الألعاب: ${games.length}`
    : "مازال ما كاين حتى لعبة في قاعدة البيانات.";
}

function renderGames() {
  const term = $("search").value.trim().toLowerCase();
  const shown = games.filter(g =>
    (g.name || "").toLowerCase().includes(term) ||
    (g.description || "").toLowerCase().includes(term)
  );
  $("gameList").innerHTML = shown.map(g => {
    const img = safeUrl(g.image_url);
    const link = safeUrl(g.game_url);
    return `<article class="card">
      ${img ? `<img src="${safeText(img)}" alt="${safeText(g.name)}" loading="lazy">` : ""}
      <h3>${safeText(g.name)}</h3>
      <p>${safeText(g.description)}</p>
      ${link ? `<a class="btn" href="${safeText(link)}" target="_blank" rel="noopener noreferrer">فتح اللعبة</a>` : ""}
    </article>`;
  }).join("");
}
function filterGames(){renderGames();}

function renderAdminGames() {
  if (!isAdmin) return;
  $("adminList").innerHTML = games.map(g => `
    <div class="card" style="margin:10px 0">
      <strong>${safeText(g.name)}</strong>
      <div class="actions" style="margin-top:10px">
        <button class="secondary" onclick="editGame(${Number(g.id)})">تعديل</button>
        <button class="danger" onclick="deleteGame(${Number(g.id)})">حذف</button>
      </div>
    </div>`).join("");
}

async function checkAdmin() {
  const {data:{user}} = await db.auth.getUser();
  if (!user) {
    isAdmin = false;
    $("admin").style.display = "none";
    return;
  }
  const {data,error} = await db.rpc("is_admin");
  isAdmin = !error && data === true;
  $("admin").style.display = isAdmin ? "block" : "none";
  if (!isAdmin) $("loginStatus").textContent =
    "هذا الحساب ما عندوش صلاحيات المدير.";
  else {
    hideLogin();
    $("loginStatus").textContent = "";
    renderAdminGames();
  }
}

$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();
  if(!db) return;
  $("loginStatus").textContent = "جاري تسجيل الدخول...";
  const {error} = await db.auth.signInWithPassword({
    email:$("email").value.trim(),
    password:$("password").value
  });
  if(error) {
    $("loginStatus").textContent = "فشل الدخول؛ تأكد من المعلومات.";
    return;
  }
  await checkAdmin();
  if(isAdmin) $("loginStatus").textContent = "تم تسجيل الدخول.";
});

$("gameForm").addEventListener("submit",async e=>{
  e.preventDefault();
  if(!isAdmin || !db) return;
  const record = {
    name:$("gameName").value.trim(),
    description:$("gameDescription").value.trim(),
    image_url:$("gameImage").value.trim(),
    game_url:$("gameUrl").value.trim()
  };
  $("adminStatus").textContent = "جاري الحفظ...";
  let result;
  if(editingId !== null) {
    result = await db.from("games").update(record).eq("id",editingId);
  } else {
    result = await db.from("games").insert(record);
  }
  if(result.error) {
    $("adminStatus").textContent = "ما نجحش الحفظ؛ راجع صلاحيات قاعدة البيانات.";
    return;
  }
  resetForm();
  $("adminStatus").textContent = "تحفظت العملية بنجاح.";
  await loadGames();
});

function editGame(id) {
  const g = games.find(item => Number(item.id) === Number(id));
  if(!g || !isAdmin) return;
  editingId = g.id;
  $("gameName").value = g.name || "";
  $("gameDescription").value = g.description || "";
  $("gameImage").value = g.image_url || "";
  $("gameUrl").value = g.game_url || "";
  $("saveButton").textContent = "حفظ التعديلات";
  $("gameForm").scrollIntoView({behavior:"smooth"});
}
async function deleteGame(id) {
  if(!isAdmin || !confirm("متأكد بلي حاب تحذف هذي اللعبة؟")) return;
  const {error} = await db.from("games").delete().eq("id",id);
  if(error) {
    $("adminStatus").textContent = "ما نجحش الحذف؛ راجع الصلاحيات.";
    return;
  }
  $("adminStatus").textContent = "تم الحذف.";
  await loadGames();
}
function resetForm() {
  editingId = null;
  $("gameForm").reset();
  $("saveButton").textContent = "إضافة اللعبة";
}
async function logout() {
  if(db) await db.auth.signOut();
  isAdmin = false;
  $("admin").style.display = "none";
  $("loginStatus").textContent = "خرجت من الحساب.";
  resetForm();
}

async function start() {
  if(!window.supabase) {
    $("status").textContent = "تعذّر تحميل مكتبة الاتصال.";
    return;
  
  if(SUPABASE_KEY === "PASTE_YOUR_PUsb_publishable_ercDvOd_Yc8VZEgrgP-71g_0kHylm9BBLISHABLE_KEY_HERE") {
    $("status").textContent = "لازم تحط مفتاح Publishable تاع Supabase في الكود.";
    return;
  }
  db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  await loadGames();
  await checkAdmin();
  db.auth.onAuthStateChange(() => {
    setTimeout(checkAdmin,0);
  });
}
start();
</script>
</body>
</html>
